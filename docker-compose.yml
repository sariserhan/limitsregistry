services:
  postgres:
    image: postgres:16-alpine
    container_name: limits-registry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: limits_registry
      POSTGRES_USER: limits
      POSTGRES_PASSWORD: limits
    ports:
      - "5433:5432"
    volumes:
      - limits_registry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limits -d limits_registry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  limits_registry_pgdata:
