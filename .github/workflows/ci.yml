name: Verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: limits_registry
          POSTGRES_USER: limits
          POSTGRES_PASSWORD: limits
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U limits -d limits_registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://limits:limits@localhost:5432/limits_registry
      SEARCH_TEST_DATABASE_URL: postgres://limits:limits@localhost:5432/limits_registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
